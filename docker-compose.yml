services:
  api:
    build: .
    command: sh -c "npm run migrate && npm start"
    environment:
      PORT: 3000
      REQUEST_TIMEOUT_MS: 1800000
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-2048}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: vertical_logistica
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: npm run worker
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: vertical_logistica
      UPLOAD_DIR: storage/uploads
      BATCH_SIZE: 1000
      WORKER_INTERVAL_MS: 2000
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vertical_logistica
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  uploads:
